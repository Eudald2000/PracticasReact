<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    picture {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    picture.is-small {
      width: 50px;
    }

    picture.is-normal {
      width: 75px;
    }

    picture.is-large {
      width: 100px;
    }

    img {
      border-radius: 50%;
      /* Hace que la imagen sea redonda */
      object-fit: cover;
      /* Asegura que la imagen se recorte correctamente */
      width: 100%;
    }

    .disabled {
      opacity: 0.3;
    }
  </style>
  <script src="https://unpkg.com/react@16/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>

<body>
  <div id="app"></div>
  <script type="text/babel">
    const $app = document.getElementById('app')
    const useState = React.useState;


    //CREA EL ELEMENTO AVATAR QUE PUEDE RECIBIR ESTAS PROPS, CON VALORES POR DEFECTO
    const Avatar = ({id, size = 'normal', name = 'No name'}) => {
      const [enabled, setEnabled] = useState(true)
      const src = `https://randomuser.me/api/portraits/women/${id}.jpg`;

      const imgClassName = enabled ? '' : 'disabled';
      let pictureClassName = '';
      if(size == 'small'){
        pictureClassName = 'is-small'
      }else if(size == 'large'){
        pictureClassName = 'is-large'
      }else{
        pictureClassName = 'is-normal' 
      }

      if(!id) return (
        <picture className={pictureClassName}>
          <img src='https://randomuser.me/api/portraits/lego/8.jpg'/>
          <strong> {name} </strong>
        </picture>
      )

      return (
        <picture className={pictureClassName}>
          <img src={src} alt="" className={imgClassName} onClick={() =>
            setEnabled(!enabled)}
          />
          <strong> {name} </strong>
        </picture>
      )
    }

    ReactDOM.render(
      <div>
        <Avatar id={1} size='small' />
        <Avatar id={5} name='Pepe' />
        <Avatar id={8} name='Jose' size='large' />
        <Avatar name='Pepe' />
      </div>
      , $app)
  </script>
</body>

</html>
